<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pan d' Casa | Temporada</title>
  <link rel="icon" type="image/png" href="/assets/Logo Pandcasa.png">
  <link rel="apple-touch-icon" href="/assets/Logo Pandcasa.png">
  <link rel="canonical" href="https://pandcasa.com/temporada">
  <link rel="stylesheet" href="/dist/tailwind.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="preload" as="image" href="/assets/TardeCafe.JPG">
</head>
<body class="bg-brand-cream text-brand-cocoa font-sans antialiased selection:bg-brand-gold/20 selection:text-brand-cocoa overflow-x-hidden">
  <!-- Navbar -->
  <div data-include="/partials/site-navbar.html"></div>

  
  <main id="inicio" class="relative z-10">
    <!-- Hero -->
    <section class="hero-section hero-section--category">
      <div id="hero-parallax-track">
        <img
          width="2000"
          height="1125"
          src="/assets/TardeCafe.JPG"
          alt="Tarde de café en Pan d' Casa"
          class="hero-zoom w-full h-full object-cover object-center"
          loading="eager"
          decoding="async"
          fetchpriority="high"
        />
      </div>
      <div class="hero-overlay"></div>
      <a href="/" class="hero-back-link absolute top-20 md:top-24 left-5 sm:left-8 md:left-14 z-20 text-sm">&larr; Volver al inicio</a>
      <div class="hero-content hero-content--category">
        <svg class="hero-category-icon w-16 h-16 md:w-20 md:h-20 text-brand-cream mx-auto mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3 13.3 10.7 20 12 13.3 13.3 12 21 10.7 13.3 4 12 10.7 10.7Z"/>
        </svg>
        <h1 class="hero-title">Productos de temporada</h1>
      </div>
    </section>

    <!-- Lista -->
    <section class="bg-brand-beige">
      <div class="wave-divider" aria-hidden="true">
        <svg viewBox="0 0 400 64" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,20 C80,55 160,8 260,48 C320,65 370,18 400,20 L400,0 L0,0 Z" fill="#502B1C"/>
        </svg>
      </div>
      <div class="max-w-6xl mx-auto px-6 lg:px-10 py-16 reveal" data-reveal>
        <div class="mb-10">
          <p class="text-xs uppercase tracking-[0.35em] text-brand-caramel">Temporada</p>
          <h2 class="mt-2 font-serif text-4xl md:text-5xl title-reveal">Ediciones limitadas</h2>
          <p class="mt-4 max-w-xl text-brand-cocoa/70 text-sm md:text-base leading-relaxed">Sabores especiales que van cambiando cada mes.</p>
        </div>
        <div class="mt-8">
          <div id="productGrid" data-category="temporada" class="grid sm:grid-cols-2 gap-8"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <div data-include="/partials/site-footer.html"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/site.js"></script>
  <script src="/js/app.js"></script>

  

</body>
</html>
