<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pan d' Casa | Temporada</title>
  <link rel="icon" type="image/png" href="/assets/Logo Pandcasa.png">
  <link rel="apple-touch-icon" href="/assets/Logo Pandcasa.png">
  <link rel="canonical" href="https://pandcasa.com/temporada">
  <link rel="stylesheet" href="/dist/tailwind.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="preload" as="image" href="/assets/TardeCafe.JPG">
</head>
<body class="bg-brand-cream text-brand-cocoa font-sans antialiased selection:bg-brand-gold/20 selection:text-brand-cocoa overflow-x-hidden">
  <!-- Navbar -->
  <div data-include="/partials/site-navbar.html"></div>

  
  <main id="inicio" class="relative z-10">
    <!-- Hero -->
    <section class="pt-0 pb-12 reveal" data-reveal>
      <div class="w-full">
        <div class="relative h-80 md:h-[520px] w-full bg-brand-beige/40 border-y border-brand-caramel/15 overflow-hidden">
          <img fetchpriority="high" src="/assets/TardeCafe.JPG" alt="Pan d’ Casa" class="absolute inset-0 w-full h-full object-cover" loading="eager" decoding="async" />
          <div class="absolute inset-0 bg-gradient-to-t from-brand-cocoa/85 via-brand-cocoa/35 to-transparent"></div>
          <div class="absolute inset-0 bg-gradient-to-tr from-brand-gold/10 via-transparent to-brand-gold2/10"></div>
          <div class="relative h-full w-full flex items-end px-5 sm:px-8 md:px-14 pb-8 sm:pb-10 md:pb-16">
            <div class="text-brand-cream">
              <p class="text-xs uppercase tracking-[0.35em] text-brand-cream">Pan d’ Casa</p>
              <h1 class="mt-2 font-serif text-3xl sm:text-4xl md:text-6xl title-reveal leading-tight">Productos de temporada</h1>
              <p class="mt-3 text-sm md:text-base text-brand-cream/70 max-w-sm md:max-w-md">Ediciones limitadas: sabores únicos, disponibles por tiempo corto.</p>
              <div class="mt-5">
                <a href="https://wa.me/50683376864?text=Hola%2C%20quisiera%20informaci%C3%B3n%20sobre%20los%20productos%20de%20temporada." target="_blank" rel="noopener" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-brand-gold text-brand-cocoa text-sm tracking-wide btn-lift font-medium">Pedir por WhatsApp</a>
              </div>
            </div>
          </div>
        </div>
      </div>

    </section>

    <!-- Lista -->
    <section class="bg-brand-beige">
      <div class="max-w-6xl mx-auto px-6 lg:px-10 py-16 reveal" data-reveal>
        <div class="mb-10">
          <p class="text-xs uppercase tracking-[0.35em] text-brand-caramel">Temporada</p>
          <h2 class="mt-2 font-serif text-4xl md:text-5xl title-reveal">Ediciones limitadas</h2>
          <p class="mt-4 max-w-xl text-brand-cocoa/70 text-sm md:text-base leading-relaxed">Sabores especiales que van cambiando cada mes.</p>
        </div>
        <div class="mt-8">
          <div id="productGrid" data-category="temporada" class="grid sm:grid-cols-2 gap-8"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <div data-include="/partials/site-footer.html"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/site.js"></script>
  <script src="../js/app.js"></script>

  

</body>
</html>
