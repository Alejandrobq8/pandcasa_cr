<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pan d' Casa | Desayunos</title>
  <link rel="icon" type="image/png" href="/assets/Logo Pandcasa.png">
  <link rel="apple-touch-icon" href="/assets/Logo Pandcasa.png">
  <link rel="canonical" href="https://pandcasa.com/desayunos">
  <link rel="preload" as="image" href="/assets/TardeCafe.JPG">
  <link rel="stylesheet" href="/dist/tailwind.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-brand-cream text-brand-cocoa font-sans antialiased selection:bg-brand-gold/20 selection:text-brand-cocoa overflow-x-hidden">
  <!-- Navbar -->
  <div data-include="/partials/site-navbar.html"></div>

  <main id="inicio" class="relative z-10">
    <!-- Hero -->
    <section class="hero-section hero-section--category">
      <div id="hero-parallax-track">
        <img
          width="2000"
          height="1125"
          src="/assets/TardeCafe.JPG"
          alt="Tarde de café en Pan d' Casa"
          class="hero-zoom w-full h-full object-cover object-center"
          loading="eager"
          decoding="async"
          fetchpriority="high"
        />
      </div>
      <div class="hero-overlay"></div>
      <a href="/" class="hero-back-link absolute top-20 md:top-24 left-5 sm:left-8 md:left-14 z-20 text-sm">&larr; Volver al inicio</a>
      <div class="hero-content hero-content--category">
        <svg class="hero-category-icon w-16 h-16 md:w-20 md:h-20 text-brand-cream mx-auto mb-4" viewBox="-2 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g fill="currentColor" fill-rule="evenodd">
            <path d="M94,7697 C90.692,7697 88,7694.308 88,7691 C88,7686.268 91.39,7681 93.688,7681 C96.539,7681 100,7687.241 100,7691 C100,7694.308 97.308,7697 94,7697 M93.688,7679 C89.27,7679 86,7686.582 86,7691 C86,7695.418 89.582,7699 94,7699 C98.418,7699 102,7695.418 102,7691 C102,7686.582 98.106,7679 93.688,7679" transform="translate(-142, -7839) translate(56, 160)"/>
          </g>
        </svg>
        <h1 class="hero-title">Desayunos</h1>
      </div>
    </section>

    <!-- Lista -->
    <section class="bg-brand-beige">
      <div class="wave-divider" aria-hidden="true">
        <svg viewBox="0 0 400 64" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,20 C80,55 160,8 260,48 C320,65 370,18 400,20 L400,0 L0,0 Z" fill="#502B1C"/>
        </svg>
      </div>
      <div class="max-w-6xl mx-auto px-6 lg:px-10 py-16 reveal" data-reveal>
        <div class="mb-10">
          <p class="text-xs uppercase tracking-[0.35em] text-brand-caramel">Selección de la mañana</p>
          <h2 class="mt-2 font-serif text-4xl md:text-5xl title-reveal">Desayunos boutique</h2>
          <p class="mt-4 max-w-xl text-brand-cocoa/70 text-sm md:text-base leading-relaxed">Piezas curadas para hoy. Pregunta por disponibilidad y recomendaciones.</p>
        </div>
        <div class="relative mt-8">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-brand-caramel/50 pointer-events-none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.197 5.197a7.5 7.5 0 0 0 10.606 10.606Z" /></svg>
          <input id="productSearch" type="search" placeholder="Buscar producto..." class="w-full rounded-full border border-brand-caramel/25 bg-brand-cream pl-10 pr-4 py-3 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-gold/50" />
        </div>
        <div class="mt-8">
          <div id="productGrid" data-category="desayunos" class="grid sm:grid-cols-2 gap-8"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <div data-include="/partials/site-footer.html"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/site.js"></script>
  <script src="/js/app.js"></script>

</body>
</html>
